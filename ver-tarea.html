<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarea EF</title><style>:root{--r:#dc0614;--i:#1f2937;--m:#6b7280;--b:#174ea6;--g:#137a4a}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:var(--i)}.top{min-height:58px;border-bottom:4px solid var(--r);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;flex-wrap:wrap;font-weight:800}.top a{background:#111;color:#fff;text-decoration:none;padding:9px 12px}.student{background:#eefaf3;border:1px solid var(--g);color:#0d653c;padding:7px 10px;font-size:12px}.criteria{border-bottom:3px solid #111;border-left:8px solid var(--r);padding:12px 16px;background:#fff}.head{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}.sub{font-size:11px;color:var(--m);margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.c{background:#f4f8ff;border:1px solid #c8d5ed;padding:9px 11px;font-size:12px;line-height:1.4}.c b{display:block;color:var(--b);font-size:13px;margin-bottom:3px}.frame{width:100%;border:0;display:block;height:calc(100vh - 265px)}@media(max-width:800px){.grid{grid-template-columns:1fr}.frame{height:calc(100vh - 410px)}}</style></head><body><div class="top"><span id="title">Educación Física</span><span id="studentChip" class="student"></span><a href="./">← Panel central</a></div><section class="criteria"><div class="head">Criterios de evaluación · Qualitas Educativa</div><div class="sub">Estos son los criterios con los que se evaluará esta tarea. Tus datos de alumno se aplican automáticamente dentro de la actividad.</div><div class="grid" id="crit"></div></section><iframe id="frame" class="frame" title="Actividad"></iframe><script>

'2.1.2':'Incorporar hábitos relacionados con procesos de activación corporal, dosificación del esfuerzo, alimentación saludable, educación postural, respiración, relajación, seguridad e higiene durante la práctica de actividades motrices, interiorizando las rutinas propias de una práctica motriz saludable y responsable.',

'2.1.5':'Analizar y valorar críticamente la incidencia que ciertas prácticas y comportamientos tienen en nuestra salud y en la convivencia, en diferentes contextos y situaciones, valorando su impacto y evitando activamente su reproducción en el entorno escolar y en las actividades de la vida cotidiana, haciendo uso para ello de herramientas informáticas.',
'2.2.1':'Desarrollar proyectos y aplicaciones de carácter individual, cooperativo o colaborativo, estableciendo mecanismos para reconducir los procesos de trabajo, utilizando con apoyo ocasional estrategias de autoevaluación y coevaluación tanto del proceso como del resultado, reconociendo y desarrollando así actitudes de superación, crecimiento y resiliencia.',
'2.2.3':'Evidenciar cierto grado de control y dominio corporal al emplear los componentes cualitativos y cuantitativos de la motricidad de manera eficiente y creativa, haciendo frente a las demandas de resolución de problemas con apoyo ocasional en situaciones motrices transferibles a su espacio vivencial con progresiva autonomía.',
'2.3.1':'Practicar una gran variedad de actividades motrices, valorando las implicaciones éticas de las actitudes antideportivas, gestionando positivamente la competitividad en contextos diversos y actuando con deportividad al asumir los roles de público, participante u otros.',
'2.3.2':'Cooperar en la práctica de diferentes producciones motrices, especialmente a través de juegos y deportes no convencionales, para alcanzar el logro individual y grupal, participando en la toma de decisiones y asumiendo distintos roles asignados y responsabilidades.',
'2.3.3':'Hacer uso con progresiva autonomía de habilidades sociales, diálogo en la resolución de conflictos y respeto ante la diversidad, mostrando una actitud crítica y un compromiso activo frente a los estereotipos, las actuaciones discriminatorias y cualquier tipo de violencia.',

'4.3.3':'Relacionarse y entenderse con el resto de participantes durante el desarrollo de diversas prácticas motrices con autonomía y haciendo uso efectivo de habilidades sociales y de diálogo en la resolución de conflictos y respeto ante la diversidad, posicionándose activamente frente a estereotipos, discriminación y violencia.',

const KEY='ef_student_identity_2026_2027',params=new URLSearchParams(location.search);let identity=null;try{identity=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(params.get('curso')&&params.get('grupo')&&params.get('alumno')){identity={course:params.get('curso'),group:params.get('grupo'),name:params.get('alumno')};localStorage.setItem(KEY,JSON.stringify(identity))}if(!identity||!identity.course||!identity.group||!identity.name){location.replace('./')}const k=params.get('t')||'nutricion',x=T[k]||T.nutricion;title.textContent=x.title;document.title=x.title;studentChip.textContent=`✓ ${identity.name} · ${identity.group}`;crit.innerHTML=x.cr.map(c=>`<div class="c"><b>EFI.${c}</b>${C[c]}</div>`).join('');const q=new URLSearchParams({v:'alumno-unico-20260907',curso:identity.course,grupo:identity.group,alumno:identity.name});frame.src=x.url+(x.url.includes('?')?'&':'?')+q.toString();
function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}function setSelect(sel,val){if(!sel||!val)return false;const nv=norm(val),opt=[...sel.options].find(o=>norm(o.value)===nv||norm(o.textContent)===nv);if(!opt)return false;if(sel.value!==opt.value){sel.value=opt.value;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}return true}function setInput(el,val){if(!el||!val)return false;if(el.value!==val){el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}return true}function candidates(doc,kind){const sels=kind==='group'?['select#group','select#grupo','select[name="group"]','select[name="grupo"]','select[id*="group" i]','select[id*="grupo" i]']:['select#name','select#nombre','select#student','select#alumno','select[name="name"]','select[name="nombre"]','select[name="student"]','select[name="alumno"]','select[id*="name" i]','select[id*="nombre" i]','select[id*="student" i]','select[id*="alumno" i]'];return [...new Set(sels.flatMap(s=>[...doc.querySelectorAll(s)]))]}function inputs(doc,kind){const sels=kind==='group'?['input#group','input#grupo','input[name="group"]','input[name="grupo"]']:['input#manual','input#name','input#nombre','input#student','input#alumno','input[name="name"]','input[name="nombre"]','input[name="student"]','input[name="alumno"]'];return [...new Set(sels.flatMap(s=>[...doc.querySelectorAll(s)]))]}function replaceBriefing(doc){try{const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=n.nodeValue.replace(/Briefing/g,'Análisis inicial').replace(/briefing/g,'análisis inicial')}catch(e){}}function autofillDoc(doc){if(!doc||!doc.body)return;replaceBriefing(doc);const gs=candidates(doc,'group');gs.forEach(s=>setSelect(s,identity.group));const ns=candidates(doc,'name');let nameSet=false;ns.forEach(s=>{if(setSelect(s,identity.name))nameSet=true});if(!nameSet&&ns.length){ns.forEach(s=>{const manual=[...s.options].find(o=>norm(o.value).includes('manual')||norm(o.textContent).includes('noaparece'));if(manual){if(s.value!==manual.value){s.value=manual.value;s.dispatchEvent(new Event('change',{bubbles:true}))}}})}inputs(doc,'group').forEach(i=>setInput(i,identity.group));inputs(doc,'name').forEach(i=>{if(i.offsetParent!==null||/manual|name|nombre|student|alumno/i.test(i.id+i.name))setInput(i,identity.name)});[...doc.querySelectorAll('iframe')].forEach(fr=>{try{fr.addEventListener('load',()=>schedule(fr));if(fr.contentDocument)autofillDoc(fr.contentDocument)}catch(e){}})}function schedule(fr){let tries=0;const run=()=>{tries++;try{autofillDoc(fr.contentDocument)}catch(e){}if(tries<24)setTimeout(run,300)};run()}frame.addEventListener('load',()=>schedule(frame));
