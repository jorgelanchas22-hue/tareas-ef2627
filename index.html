<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tareas de Educación Física</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>:root{--ink:#1a1a1a;--soft:#6b6b6b;--line:#dadada;--red:#dc0614;--green:#1f7a4d;--orange:#c98a22}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,sans-serif}.wrap{max-width:1280px;margin:auto;padding:30px 20px 80px}.mast{border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.mast h1{font-family:'Big Shoulders Display',sans-serif;font-size:clamp(34px,6vw,54px);line-height:.9;margin:0;text-transform:uppercase}.sub{font:12px 'JetBrains Mono',monospace;color:var(--soft);letter-spacing:1px;margin-top:8px}.profBox{border:3px solid #111;padding:10px;background:#fff;text-align:center}.prof{display:block;font:800 13px 'JetBrains Mono',monospace;text-transform:uppercase;background:#111;color:#fff;text-decoration:none;padding:13px 18px}.profHint{font-size:10px;color:var(--soft);margin-top:6px}.notice{border:2px solid var(--ink);padding:14px 16px;margin-bottom:22px;font-size:13px;line-height:1.55}.courses{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.course{border:3px solid var(--ink);padding:16px;background:#fff}.course h2{font-family:'Big Shoulders Display',sans-serif;font-size:34px;text-transform:uppercase;margin:0 0 14px;padding-bottom:10px;border-bottom:3px solid var(--red)}.eval{margin-bottom:24px}.head{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}.head h3{font:13px 'JetBrains Mono',monospace;margin:0;text-transform:uppercase}.dates{font:10px 'JetBrains Mono',monospace;color:var(--soft);margin-top:4px}.badge{font:10px 'JetBrains Mono',monospace;border:1px solid;padding:4px 7px;white-space:nowrap;height:max-content}.badge.open{color:var(--green);border-color:var(--green)}.badge.future{color:var(--orange);border-color:var(--orange)}.badge.closed{color:#777;border-color:#999}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#f7f7f7;border:2px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:160px}.num{font:10px 'JetBrains Mono',monospace;color:var(--soft);text-transform:uppercase}.card h4{font-family:'Big Shoulders Display',sans-serif;font-size:19px;text-transform:uppercase;margin:0;line-height:1.05}.card p{font-size:12px;line-height:1.4;color:var(--soft);margin:0;flex:1}.criteriaMini{font:700 10px 'JetBrains Mono',monospace;color:#174ea6}.btn{align-self:flex-start;font:11px 'JetBrains Mono',monospace;padding:8px 11px;border:2px solid var(--red);background:var(--red);color:#fff;text-decoration:none;text-transform:uppercase}.locked{font:10px 'JetBrains Mono',monospace;color:var(--soft)}@media(max-width:900px){.courses{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.head{flex-direction:column}}</style></head><body><div class="wrap"><div class="mast"><div><h1>Tareas de<br>Educación Física</h1><div class="sub">CURSO 2026-2027</div></div><div class="profBox"><a class="prof" href="profesor/?v=20260824">🔒 ZONA PROFESOR →</a><div class="profHint">Evaluación · criterios · evidencias · notas</div></div></div><div class="notice" id="notice"></div><div class="courses"><section class="course"><h2>2.º ESO</h2><div id="course2"></div></section><section class="course"><h2>4.º ESO</h2><div id="course4"></div></section></div></div><script>const STUDENT_MODE_START=new Date('2026-09-15T00:00:00');const WINDOWS={1:{start:'2026-09-20',end:'2026-12-01',label:'20 sep 2026 – 1 dic 2026'},2:{start:'2026-12-15',end:'2027-03-03',label:'15 dic 2026 – 3 mar 2027'},3:{start:'2027-03-15',end:'2027-06-01',label:'15 mar 2027 – 1 jun 2027'}};const TASKS=[
{curso:'2',evaluacion:1,slot:1,titulo:'Nutrición y Vida Activa',descripcion:'Macronutrientes, etiquetas, Dieta Mediterránea, menú semanal y test.',cr:'EFI.2.1.2 · EFI.2.1.5',id:'nutricion'},{curso:'2',evaluacion:1,slot:2,titulo:'CASO DOMS',descripcion:'Agujetas: ciencia, mitos, recuperación y aplicación.',cr:'EFI.2.1.2 · EFI.2.1.3',id:'doms'},{curso:'2',evaluacion:2,slot:1,titulo:'MISIÓN 112',descripcion:'PAS, primeros auxilios, decisiones y práctica segura.',cr:'EFI.2.1.3 · EFI.2.1.4',id:'mision112'},{curso:'2',evaluacion:2,slot:2,titulo:'JUEGA LIMPIO',descripcion:'Dilemas, inclusión, convivencia y compromiso.',cr:'EFI.2.3.1 · EFI.2.3.3',id:'juegalimpio'},{curso:'2',evaluacion:3,slot:1,titulo:'INVENTA UN DEPORTE',descripcion:'Diseño, prueba, inclusión, mejora y presentación.',cr:'EFI.2.2.1 · EFI.2.3.2',id:'inventadeporte'},{curso:'2',evaluacion:3,slot:2,titulo:'EL PODER DEL CORE',descripcion:'Postura, estabilidad, técnica y hábitos diarios.',cr:'EFI.2.1.2 · EFI.2.2.3',id:'core'},
{curso:'4',evaluacion:1,slot:1,titulo:'Mitos de la Actividad Física',descripcion:'Análisis inicial → investigación → contraste de evidencias → transferencia.',cr:'EFI.4.1.5 · EFI.4.1.6',id:'mitos'},{curso:'4',evaluacion:1,slot:2,titulo:'Presión Competitiva',descripcion:'Análisis inicial → diagnóstico → regulación → plan personal.',cr:'EFI.4.1.2 · EFI.4.3.1',id:'presion'},{curso:'4',evaluacion:2,slot:1,titulo:'Estrategia Deportiva',descripcion:'Análisis inicial → lectura táctica → adaptación → Plan A/Plan B.',cr:'EFI.4.2.2 · EFI.4.2.3',id:'estrategia'},{curso:'4',evaluacion:2,slot:2,titulo:'Arbitraje Deportivo',descripcion:'Análisis inicial → casos → decisión → comunicación y protocolo.',cr:'EFI.4.3.1 · EFI.4.3.3',id:'arbitraje'},{curso:'4',evaluacion:3,slot:1,titulo:'Reto Motriz',descripcion:'Análisis inicial → diseño → prueba → validación → rediseño V2.',cr:'EFI.4.2.1 · EFI.4.2.3',id:'reto'},{curso:'4',evaluacion:3,slot:2,titulo:'Gymkhana de Orientación',descripcion:'Análisis inicial → diseño → validación de recorrido, flujo y seguridad.',cr:'EFI.4.5.2 · EFI.4.2.1',id:'gymkhana'}];function prep(){return new Date()<STUDENT_MODE_START}function state(ev){if(prep())return{cls:'open',txt:'● Preparación · abierto',canOpen:true};const w=WINDOWS[ev],n=new Date(),s=new Date(w.start+'T00:00:00'),e=new Date(w.end+'T23:59:59');if(n<s)return{cls:'future',txt:'Aún no abierta',canOpen:false};if(n>e)return{cls:'closed',txt:'Plazo cerrado',canOpen:false};return{cls:'open',txt:'● Plazo abierto',canOpen:true}}function renderCourse(course,target){const c=document.getElementById(target);c.innerHTML='';[1,2,3].forEach(ev=>{const st=state(ev),w=WINDOWS[ev],ts=TASKS.filter(t=>t.curso===course&&t.evaluacion===ev),block=document.createElement('div');block.className='eval';block.innerHTML=`<div class="head"><div><h3>${ev}ª Evaluación</h3><div class="dates">${w.label}</div></div><span class="badge ${st.cls}">${st.txt}</span></div><div class="cards">${ts.map(t=>`<div class="card"><span class="num">Tarea ${t.slot}</span><h4>${t.titulo}</h4><p>${t.descripcion}</p><div class="criteriaMini">${t.cr}</div>${st.canOpen?`<a class="btn" href="ver-tarea.html?t=${t.id}">Abrir tarea →</a>`:`<span class="locked">${st.txt}</span>`}</div>`).join('')}</div>`;c.appendChild(block)})}notice.innerHTML=prep()?'<b>Modo preparación:</b> las tareas publicadas están abiertas. <b>Cada tarea muestra sus criterios de evaluación de Qualitas antes de comenzar.</b> En 4.º ESO el recorrido es: <b>Análisis inicial → actividad → fase avanzada.</b>':'<b>Modo alumnado:</b> cada tarea se abre según sus fechas. Antes de empezar podrás ver los criterios con los que será evaluada.';renderCourse('2','course2');renderCourse('4','course4');</script></body></html>
