<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tareas de Educación Física</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--paper:#fff;--card:#f7f7f7;--ink:#1a1a1a;--soft:#6b6b6b;--line:#dadada;--red:#dc0614;--green:#1f7a4d;--orange:#c98a22}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 20px 80px}.mast{border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.mast h1{font-family:'Big Shoulders Display',sans-serif;font-size:clamp(34px,6vw,54px);line-height:.9;margin:0;text-transform:uppercase}.sub{font:12px 'JetBrains Mono',monospace;color:var(--soft);letter-spacing:1px;margin-top:8px}.prof{font:700 12px 'JetBrains Mono',monospace;text-transform:uppercase;background:#111;color:#fff;text-decoration:none;padding:10px 14px;border:2px solid #111}.notice{border:2px solid var(--ink);padding:14px 16px;margin-bottom:20px;font-size:13px;line-height:1.55}.tabs{display:flex;gap:8px;margin-bottom:24px}.tab{flex:1;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:21px;text-transform:uppercase;padding:14px;border:2px solid var(--ink);background:#fff;cursor:pointer}.tab.on{background:var(--red);color:#fff;border-color:var(--red)}.eval{margin-bottom:30px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}.head h2{font:13px 'JetBrains Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;margin:0}.dates{font:11px 'JetBrains Mono',monospace;margin-top:4px}.badge{font:11px 'JetBrains Mono',monospace;border:1px solid;padding:5px 9px}.badge.open{color:var(--green);border-color:var(--green)}.badge.future{color:var(--orange);border-color:var(--orange)}.badge.closed{color:#777;border-color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px}.card.empty{border-style:dashed;border-color:var(--line)}.num{font:11px 'JetBrains Mono',monospace;color:var(--soft);letter-spacing:1px;text-transform:uppercase}.card h3{font-family:'Big Shoulders Display',sans-serif;font-size:21px;text-transform:uppercase;margin:0;line-height:1.05}.card p{font-size:13px;line-height:1.4;color:var(--soft);margin:0;flex:1}.btn{align-self:flex-start;font:12px 'JetBrains Mono',monospace;padding:9px 14px;border:2px solid var(--red);background:var(--red);color:#fff;text-decoration:none;text-transform:uppercase}.locked{font:11px 'JetBrains Mono',monospace;color:var(--soft);border:1px solid var(--line);padding:8px}.pending{font:11px 'JetBrains Mono',monospace;color:var(--soft)}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="mast"><div><h1>Tareas de<br>Educación Física</h1><div class="sub">2º Y 4º ESO · CURSO 2026-2027</div></div><a class="prof" href="/tareas-ef2627/profesor/">Profesor →</a></div><div class="notice" id="notice"></div><div class="tabs" id="courseTabs"></div><div id="evaluaciones"></div></div><script>
const STUDENT_MODE_START=new Date('2026-09-15T00:00:00');const WINDOWS={1:{start:'2026-09-20',end:'2026-12-01',label:'20 sep 2026 – 1 dic 2026'},2:{start:'2026-12-15',end:'2027-03-03',label:'15 dic 2026 – 3 mar 2027'},3:{start:'2027-03-15',end:'2027-06-01',label:'15 mar 2027 – 1 jun 2027'}};const TASKS=[{curso:'4',evaluacion:1,slot:1,titulo:'Expediente de Verificación: Mitos de la Actividad Física',descripcion:'5 estaciones mito/realidad + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval1-tarea1-mitos/'},{curso:'4',evaluacion:1,slot:2,titulo:'Expediente de Verificación: Presión Competitiva',descripcion:'5 estaciones sobre psicología del rendimiento + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval1-tarea2-presion%20dentro/'},{curso:'4',evaluacion:2,slot:1,titulo:'Expediente de Verificación: Estrategia Deportiva',descripcion:'5 estaciones sobre ataque, defensa y táctica + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval2-tarea1-estrategia/'},{curso:'4',evaluacion:2,slot:2,titulo:'Expediente de Verificación: Arbitraje Deportivo',descripcion:'5 estaciones sobre arbitraje y juego limpio + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval2-tarea2-arbitraje/'},{curso:'4',evaluacion:3,slot:1,titulo:'Reto Motriz',descripcion:'Diseño individual de un reto motriz. Actividad en preparación.',url:''},{curso:'4',evaluacion:3,slot:2,titulo:'Diseña tu Gymkhana Deportiva de Orientación',descripcion:'Proyecto individual de 8 controles con entrega, galería común y valoración de propuestas.',url:'/tareas-ef2627/4ºESO/eval3-tarea1-gymkhana-orientacion/'},{curso:'2',evaluacion:1,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:1,slot:2,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:2,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:2,slot:2,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:3,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:3,slot:2,titulo:'',descripcion:'',url:''}];let active='4';function prep(){return new Date()<STUDENT_MODE_START}function state(ev){if(prep())return{cls:'open',txt:'● Preparación · abierto',canOpen:true};const w=WINDOWS[ev],n=new Date(),s=new Date(w.start+'T00:00:00'),e=new Date(w.end+'T23:59:59');if(n<s)return{cls:'future',txt:'🔒 Aún no abierta',canOpen:false};if(n>e)return{cls:'closed',txt:'Plazo cerrado',canOpen:false};return{cls:'open',txt:'● Plazo abierto',canOpen:true}}
function tabs(){const e=document.getElementById('courseTabs');e.innerHTML='';[['4','4º ESO'],['2','2º ESO']].forEach(([v,l])=>{const b=document.createElement('button');b.className='tab'+(active===v?' on':'');b.textContent=l;b.onclick=()=>{active=v;render()};e.appendChild(b)})}function render(){tabs();document.getElementById('notice').innerHTML=prep()?'<b>Modo preparación:</b> hasta el 14 de septiembre todas las tareas publicadas permanecen abiertas para revisión del profesor. El <b>15 de septiembre</b> el panel pasa automáticamente a modo alumnado y comienza a aplicar los plazos indicados.':'<b>Modo alumnado:</b> las tareas se abren y cierran según las fechas de cada evaluación. El profesor dispone de su acceso independiente en el botón <b>Profesor</b>.';const c=document.getElementById('evaluaciones');c.innerHTML='';[1,2,3].forEach(ev=>{const st=state(ev),w=WINDOWS[ev],block=document.createElement('div');block.className='eval';const ts=TASKS.filter(t=>t.curso===active&&t.evaluacion===ev).sort((a,b)=>a.slot-b.slot);const cards=ts.map(t=>{if(!t.titulo)return`<div class="card empty"><span class="num">Tarea ${t.slot}</span><p>Sin asignar todavía.</p></div>`;let action;if(!t.url)action='<span class="pending">Pendiente de publicar</span>';else if(st.canOpen)action=`<a class="btn" href="${t.url}">Abrir tarea →</a>`;else action=`<span class="locked">${st.txt}</span>`;return`<div class="card"><span class="num">Tarea ${t.slot}</span><h3>${t.titulo}</h3><p>${t.descripcion}</p>${action}</div>`}).join('');block.innerHTML=`<div class="head"><div><h2>${ev}ª Evaluación</h2><div class="dates">${w.label}</div></div><span class="badge ${st.cls}">${st.txt}</span></div><div class="grid">${cards}</div>`;c.appendChild(block)})}render();
</script></body></html>
