<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas de Educación Física</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E4D6; --card:#F7F4EA; --ink:#14202E; --ink-soft:#4A5568;
  --mito:#B23A2E; --realidad:#1F7A4D; --realidad-bg:#DCEDE1;
  --warn:#C98A22; --line:#C9C2AC;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:900px;margin:0 auto;padding:30px 20px 80px;}
.masthead{border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:24px;}
.masthead h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:clamp(28px,6vw,44px);line-height:.95;margin:0;text-transform:uppercase;}
.masthead .sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:6px;}

.cursoTabs{display:flex;gap:8px;margin-bottom:24px;}
.cursoTab{flex:1;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;letter-spacing:.5px;text-transform:uppercase;padding:14px;border:2px solid var(--ink);background:transparent;cursor:pointer;color:var(--ink);}
.cursoTab.on{background:var(--ink);color:var(--paper);}

.evalBlock{margin-bottom:26px;}
.evalBlock h2{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}
.taskGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.taskGrid{grid-template-columns:1fr;}}
.taskCard{background:var(--card);border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px;}
.taskCard.empty{border-style:dashed;border-color:var(--line);background:transparent;}
.taskCard .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;}
.taskCard h3{font-family:'Big Shoulders Display',sans-serif;font-size:19px;text-transform:uppercase;margin:0;line-height:1.1;}
.taskCard p{font-size:13px;line-height:1.4;color:var(--ink-soft);margin:0;flex:1;}
.taskCard.empty p{font-style:italic;}
.taskCard a.btn{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.5px;padding:9px 14px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Tareas de<br>Educación Física</h1>
    <div class="sub">2º Y 4º ESO · POR EVALUACIÓN</div>
  </div>

  <div class="cursoTabs" id="cursoTabs"></div>
  <div id="evaluaciones"></div>
</div>

<script>
// ── TAREAS ─────────────────────────────────────────────────────
// Añade o edita aquí cada tarea. Deja "url":"" para que se vea como
// "sin asignar" hasta que la tengas publicada.
const TASKS = [
  {curso:"4", evaluacion:1, slot:1,
   titulo:"Expediente de Verificación: Mitos de la Actividad Física",
   descripcion:"5 estaciones mito/realidad + situaciones reales para resolver.",
   url:"4oESO/eval1-tarea1-mitos/"},
  {curso:"4", evaluacion:1, slot:2, titulo:"", descripcion:"", url:""},
  {curso:"4", evaluacion:2, slot:1, titulo:"", descripcion:"", url:""},
  {curso:"4", evaluacion:2, slot:2, titulo:"", descripcion:"", url:""},
  {curso:"4", evaluacion:3, slot:1, titulo:"", descripcion:"", url:""},
  {curso:"4", evaluacion:3, slot:2, titulo:"", descripcion:"", url:""},
  {curso:"2", evaluacion:1, slot:1, titulo:"", descripcion:"", url:""},
  {curso:"2", evaluacion:1, slot:2, titulo:"", descripcion:"", url:""},
  {curso:"2", evaluacion:2, slot:1, titulo:"", descripcion:"", url:""},
  {curso:"2", evaluacion:2, slot:2, titulo:"", descripcion:"", url:""},
  {curso:"2", evaluacion:3, slot:1, titulo:"", descripcion:"", url:""},
  {curso:"2", evaluacion:3, slot:2, titulo:"", descripcion:"", url:""},
];

let cursoActivo = "4";

function renderCursoTabs(){
  const el = document.getElementById("cursoTabs");
  el.innerHTML = "";
  [["4","4º ESO"],["2","2º ESO"]].forEach(([val,label])=>{
    const b = document.createElement("button");
    b.className = "cursoTab" + (cursoActivo===val ? " on":"");
    b.textContent = label;
    b.onclick = ()=>{ cursoActivo = val; render(); };
    el.appendChild(b);
  });
}

function render(){
  renderCursoTabs();
  const cont = document.getElementById("evaluaciones");
  cont.innerHTML = "";
  [1,2,3].forEach(ev=>{
    const block = document.createElement("div");
    block.className = "evalBlock";
    const tareas = TASKS.filter(t=> t.curso===cursoActivo && t.evaluacion===ev).sort((a,b)=>a.slot-b.slot);
    const cardsHtml = tareas.map(t=>{
      if(!t.titulo){
        return `<div class="taskCard empty"><span class="num">Tarea ${t.slot}</span><p>Sin asignar todavía.</p></div>`;
      }
      const boton = t.url
        ? `<a class="btn" href="${t.url}">Abrir tarea →</a>`
        : `<span class="taskCard empty" style="border:none;padding:0;"><p>(pendiente de publicar)</p></span>`;
      return `<div class="taskCard">
        <span class="num">Tarea ${t.slot}</span>
        <h3>${t.titulo}</h3>
        <p>${t.descripcion||""}</p>
        ${boton}
      </div>`;
    }).join("");
    block.innerHTML = `<h2>${ev}ª Evaluación</h2><div class="taskGrid">${cardsHtml}</div>`;
    cont.appendChild(block);
  });
}
render();
</script>
</body>
</html>
