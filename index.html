<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas de Educación Física</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--card:#F7F7F7;--ink:#1A1A1A;--ink-soft:#6B6B6B;--line:#DADADA;--red:#DC0614;--green:#1F7A4D;--amber:#C98A22;}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif}.wrap{max-width:900px;margin:0 auto;padding:30px 20px 80px}.masthead{border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:24px}.masthead h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:clamp(28px,6vw,44px);line-height:.95;margin:0;text-transform:uppercase}.masthead .sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:6px}.cursoTabs{display:flex;gap:8px;margin-bottom:24px}.cursoTab{flex:1;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;letter-spacing:.5px;text-transform:uppercase;padding:14px;border:2px solid var(--ink);background:transparent;cursor:pointer;color:var(--ink)}.cursoTab.on{background:var(--red);color:#fff;border-color:var(--red)}.evalBlock{margin-bottom:26px}.evalHead{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap}.evalHead h2{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin:0}.state{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 8px;border:1px solid}.state.open{color:var(--green);border-color:var(--green)}.state.closed{color:#9b1c1c;border-color:#9b1c1c}.state.future{color:var(--amber);border-color:var(--amber)}.taskGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.taskGrid{grid-template-columns:1fr}}.taskCard{background:var(--card);border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:135px}.taskCard.empty{border-style:dashed;border-color:var(--line);background:transparent}.taskCard .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase}.taskCard h3{font-family:'Big Shoulders Display',sans-serif;font-size:19px;text-transform:uppercase;margin:0;line-height:1.1}.taskCard p{font-size:13px;line-height:1.4;color:var(--ink-soft);margin:0;flex:1}.btn{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.5px;padding:9px 14px;border:2px solid var(--red);background:var(--red);color:#fff;text-decoration:none;text-transform:uppercase}.notice{background:#fff7e6;border:2px solid var(--amber);padding:12px 14px;margin-bottom:18px;font-size:13px;line-height:1.45}
</style>
</head>
<body><div class="wrap"><div class="masthead"><h1>Tareas de<br>Educación Física</h1><div class="sub">2º Y 4º ESO · CURSO 2026-2027</div></div><div class="notice"><b>Plazos del curso:</b> el panel muestra qué evaluación está abierta, cerrada o pendiente. El control individual por alumno y el desbloqueo entre Tarea 1 y Tarea 2 se aplicará dentro de cada actividad tras la identificación.</div><div class="cursoTabs" id="cursoTabs"></div><div id="evaluaciones"></div></div>
<script>
const PERIODOS={1:{inicio:'2026-09-20',fin:'2026-12-01'},2:{inicio:'2026-12-15',fin:'2027-03-03'},3:{inicio:'2027-03-15',fin:'2027-06-01'}};
const TASKS=[
{curso:'4',evaluacion:1,slot:1,titulo:'Expediente de Verificación: Mitos de la Actividad Física',descripcion:'5 estaciones mito/realidad + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval1-tarea1-mitos/'},
{curso:'4',evaluacion:1,slot:2,titulo:'Expediente de Verificación: Presión Competitiva',descripcion:'5 estaciones sobre psicología del rendimiento + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval1-tarea2-presion%20dentro/'},
{curso:'4',evaluacion:2,slot:1,titulo:'Expediente de Verificación: Estrategia Deportiva',descripcion:'5 estaciones sobre ataque, defensa y táctica + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval2-tarea1-estrategia/'},
{curso:'4',evaluacion:2,slot:2,titulo:'Expediente de Verificación: Arbitraje Deportivo',descripcion:'5 estaciones sobre el rol del árbitro y el juego limpio + situaciones reales para resolver.',url:'/tareas-ef2627/4ºESO/eval2-tarea2-arbitraje/'},
{curso:'4',evaluacion:3,slot:1,titulo:'Reto Motriz',descripcion:'Diseño individual de un reto motriz. Actividad en preparación.',url:''},
{curso:'4',evaluacion:3,slot:2,titulo:'Diseña tu Gymkhana Deportiva de Orientación',descripcion:'Proyecto individual de 8 controles con entrega, galería común y valoración de propuestas.',url:'/tareas-ef2627/4ºESO/eval3-tarea1-gymkhana-orientacion/'},
{curso:'2',evaluacion:1,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:1,slot:2,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:2,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:2,slot:2,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:3,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:3,slot:2,titulo:'',descripcion:'',url:''}];
let cursoActivo='4';
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
function estadoPeriodo(ev){const p=PERIODOS[ev],hoy=new Date(),ini=new Date(p.inicio+'T00:00:00'),fin=new Date(p.fin+'T23:59:59');if(hoy<ini)return 'future';if(hoy>fin)return 'closed';return 'open'}
function estadoTexto(ev){const s=estadoPeriodo(ev),p=PERIODOS[ev];if(s==='open')return `ABIERTO · hasta ${fmt(p.fin)}`;if(s==='future')return `ABRE · ${fmt(p.inicio)}`;return `CERRADO · ${fmt(p.fin)}`}
function renderCursoTabs(){const el=document.getElementById('cursoTabs');el.innerHTML='';[['4','4º ESO'],['2','2º ESO']].forEach(([v,l])=>{const b=document.createElement('button');b.className='cursoTab'+(cursoActivo===v?' on':'');b.textContent=l;b.onclick=()=>{cursoActivo=v;render()};el.appendChild(b)})}
function render(){renderCursoTabs();const cont=document.getElementById('evaluaciones');cont.innerHTML='';[1,2,3].forEach(ev=>{const state=estadoPeriodo(ev),block=document.createElement('div');block.className='evalBlock';const tareas=TASKS.filter(t=>t.curso===cursoActivo&&t.evaluacion===ev).sort((a,b)=>a.slot-b.slot);const cards=tareas.map(t=>{if(!t.titulo)return `<div class="taskCard empty"><span class="num">Tarea ${t.slot}</span><p>Sin asignar todavía.</p></div>`;const action=t.url?`<a class="btn" href="${t.url}">Abrir tarea →</a>`:`<span style="font-size:12px;color:var(--ink-soft)">Pendiente de publicar.</span>`;return `<div class="taskCard"><span class="num">Tarea ${t.slot}</span><h3>${t.titulo}</h3><p>${t.descripcion||''}</p>${action}</div>`}).join('');block.innerHTML=`<div class="evalHead"><h2>${ev}ª Evaluación · ${fmt(PERIODOS[ev].inicio)} — ${fmt(PERIODOS[ev].fin)}</h2><span class="state ${state}">${estadoTexto(ev)}</span></div><div class="taskGrid">${cards}</div>`;cont.appendChild(block)})}
render();
</script></body></html>
