function quitarImportado(i){state.importPreview.splice(i,1);render()}
function descargarPlantilla(){const csv='Apellidos;Nombre\nGarcía López;Ana\nMartín Ruiz;Pablo\n',link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));link.download='plantilla_alumnado.csv';link.click();URL.revokeObjectURL(link.href)}
function confirmarImportacion(){const curso=state.importCurso||CURSOS[0],lista=state.importPreview.slice();if(!lista.length)return;const updates={};lista.forEach(n=>{const ref=db.ref(pathBase()+'/alumnos').push();updates[ref.key]={nombre:n,curso}});db.ref(pathBase()+'/alumnos').update(updates).then(()=>{state.importPreview=[];state.importFileName='';state.importRejected=0;showToast(lista.length+' alumnos importados')}).catch(()=>showToast('No se pudo completar la importación'))}
function profBateria(){let h='<div class="card"><h2>Batería física conectada con EduFísica</h2><p class="desc">Solo lectura. Las marcas se introducen en EduFísica y aquí se incorporan automáticamente como complemento posterior.</p>';if(state.eduStatus==='ok')h+='<div class="notice">Conexión activa con EduFísica · 1ª Evaluación.</div>';else if(state.eduStatus==='loading')h+='<div class="notice warn">Conectando con EduFísica…</div>';else h+='<div class="notice error">No se ha podido leer EduFísica. La evaluación inicial sigue funcionando, pero las marcas no pueden mostrarse ahora.</div>';h+='<select onchange="state.profBatCurso=this.value;render()"><option value="">Selecciona grupo...</option>';CURSOS.forEach(c=>h+='<option'+(state.profBatCurso===c?' selected':'')+'>'+c+'</option>');h+='</select></div>';if(!state.profBatCurso)return h;const als=state.alumnos.filter(a=>a.curso===state.profBatCurso);als.forEach(a=>{const b=getBateriaEdu(a);h+='<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div class="pill" style="margin:0">'+a.nombre+'</div>'+batteryStatusHtml(b)+'</div>';if(!b.linked)h+='<p class="small" style="margin-top:10px">No encuentro una coincidencia de nombre y grupo en EduFísica. Revisa que figure igual en ambas apps.</p>';else if(b.hechas)h+=bateriaGrid(b);else h+='<p class="small" style="margin-top:10px">Todavía no tiene marcas de la 1ª Evaluación en EduFísica.</p>';h+='</div>'});return h}
function profRegistros(){let h='';CURSOS.forEach(c=>{const als=state.alumnos.filter(a=>a.curso===c);if(!als.length)return;h+='<div class="card"><h2 style="font-size:1rem">'+c+'</h2><table><tr><th>Alumno</th><th>Con.</th><th>Ruf.</th><th>Háb.</th><th>Inicial</th><th>Batería</th><th></th></tr>';als.forEach(a=>{const r=calcNotaFinal(a.id),b=getBateriaEdu(a);if(!r){h+='<tr><td>'+a.nombre+'</td><td colspan="4" class="small">Sin evaluación</td><td>'+batteryStatusHtml(b)+'</td><td><button class="ghost" style="padding:4px 8px;font-size:.7rem" onclick="verFicha(\''+a.id+'\')">Ver</button></td></tr>';return}h+='<tr><td>'+a.nombre+'</td><td>'+(r.conoc??'—')+'</td><td>'+(r.ruf??'—')+'</td><td>'+(r.act!==null&&r.act!==undefined?r.act.toFixed(1):'—')+'</td><td><span class="badge '+badgeClass(r.final)+'">'+r.final+'</span></td><td>'+batteryStatusHtml(b)+'</td><td><button class="ghost" style="padding:4px 8px;font-size:.7rem" onclick="verFicha(\''+a.id+'\')">Ver</button></td></tr>'});h+='</table></div>'});h+='<div class="card"><button class="full" onclick="exportarCSV()">Exportar CSV</button></div>';if(state.editingId)h+=profFicha();return h}
function verFicha(id){state.editingId=id;render()}
function profFicha(){const a=state.alumnos.find(x=>x.id===state.editingId);if(!a)return'';const reg=state.registros[a.id]||{},ruf=reg.ruffier||{},clave=(state.claves||CONOCIMIENTOS_DEFAULT)[esCuarto(a.curso)?'4':'2'],act=reg.actitud||[],con=reg.conocimientos||[],rufCalc=calcRuffierNota(ruf.p1,ruf.p2,ruf.p3),b=getBateriaEdu(a);let h='<div class="card"><span class="back" onclick="state.editingId=null;render()">← Cerrar ficha</span><h2>'+a.nombre+'</h2><label>Nombre</label><input id="fi-nombre" value="'+a.nombre+'"><label>Grupo</label><select id="fi-curso">';CURSOS.forEach(c=>h+='<option'+(a.curso===c?' selected':'')+'>'+c+'</option>');h+='</select><label>¿Ha repetido curso?</label><input id="fi-repite" value="'+(a.repite||'')+'"><label>Aficiones</label><input id="fi-aficiones" value="'+(a.aficiones||'')+'"></div><div class="card"><h2 style="font-size:1rem">Datos médicos</h2><label>¿Enfermedad?</label><select id="fi-enf"><option value="Sí"'+(reg.medico&&reg.medico.enfermedad==='Sí'?' selected':'')+'>Sí</option><option value="No"'+(!reg.medico||reg.medico.enfermedad!=='Sí'?' selected':'')+'>No</option></select><label>¿Cuál?</label><input id="fi-enf-cual" value="'+((reg.medico&&reg.medico.enfermedadCual)||'')+'"><label>¿Operado/a?</label><select id="fi-op"><option value="Sí"'+(reg.medico&&reg.medico.operado==='Sí'?' selected':'')+'>Sí</option><option value="No"'+(!reg.medico||reg.medico.operado!=='Sí'?' selected':'')+'>No</option></select></div><div class="card"><h2 style="font-size:1rem">Ruffier-Dickson</h2><div class="grid3"><div><label>Peso</label><input type="number" id="fi-rf-peso" value="'+(ruf.peso||'')+'"></div><div><label>Talla</label><input type="number" step=".01" id="fi-rf-talla" value="'+(ruf.talla||'')+'"></div><div><label>Reposo</label><input type="number" id="fi-rf-p1" value="'+(ruf.p1||'')+'"></div></div><div class="grid2"><div><label>Al terminar</label><input type="number" id="fi-rf-p2" value="'+(ruf.p2||'')+'"></div><div><label>1 min después</label><input type="number" id="fi-rf-p3" value="'+(ruf.p3||'')+'"></div></div><p class="small" style="margin-top:8px;font-weight:600">'+(rufCalc?'Resultado: '+rufCalc.resultado+' · '+rufCalc.franja+' · Nota: '+rufCalc.nota:'Sin datos suficientes')+'</p></div><div class="card"><h2 style="font-size:1rem">Batería física · EduFísica</h2><p class="desc">Solo lectura. No modifica la evaluación inicial cerrada.</p>'+batteryStatusHtml(b)+(b.hechas?bateriaGrid(b):'')+'</div><div class="card"><h2 style="font-size:1rem">Actitud y hábitos</h2>';ACTITUD_PREGUNTAS.forEach((p,i)=>{h+='<label>'+p.q+'</label><select id="fi-act-'+i+'"><option value="">— sin responder —</option>';p.opts.forEach((o,j)=>h+='<option value="'+j+'"'+(act[i]===j?' selected':'')+'>'+o+'</option>');h+='</select>'});h+='</div><div class="card"><h2 style="font-size:1rem">Conocimientos previos</h2>';clave.forEach((p,i)=>{const r=con[i];h+='<label>'+(i+1)+'. '+p.q+(p.tipo==='multi'?' (elige dos)':'')+'</label>';if(p.tipo==='single'){h+='<select id="fi-con-'+i+'"><option value="">— sin responder —</option>';p.opts.forEach((o,j)=>h+='<option value="'+j+'"'+(r===j?' selected':'')+'>'+o+(j===p.correcta?' ✓ correcta':'')+'</option>');h+='</select>'}else{p.opts.forEach((o,j)=>h+='<div class="opt '+(Array.isArray(r)&&r.includes(j)?'sel':'')+'" style="cursor:default">'+o+(p.correcta.includes(j)?' ✓ correcta':'')+(Array.isArray(r)&&r.includes(j)?' · elegida':'')+'</div>')}});h+='</div><div class="navrow"><button class="ghost" onclick="state.editingId=null;render()">Cerrar sin guardar</button><button onclick="guardarFicha()">Guardar cambios</button></div>';return h}
function guardarFicha(){const id=state.editingId,a=state.alumnos.find(x=>x.id===id);if(!a)return;const curso=document.getElementById('fi-curso').value;db.ref(pathBase()+'/alumnos/'+id).update({nombre:document.getElementById('fi-nombre').value.trim(),curso,repite:document.getElementById('fi-repite').value,aficiones:document.getElementById('fi-aficiones').value});const medico={enfermedad:document.getElementById('fi-enf').value,enfermedadCual:document.getElementById('fi-enf-cual').value,operado:document.getElementById('fi-op').value},p1=document.getElementById('fi-rf-p1').value,p2=document.getElementById('fi-rf-p2').value,p3=document.getElementById('fi-rf-p3').value,ruffier=(p1&&p2&&p3)?{peso:document.getElementById('fi-rf-peso').value,talla:document.getElementById('fi-rf-talla').value,p1:parseFloat(p1),p2:parseFloat(p2),p3:parseFloat(p3)}:null,actitud=ACTITUD_PREGUNTAS.map((p,i)=>{const v=document.getElementById('fi-act-'+i).value;return v===''?null:parseInt(v)}),clave=(state.claves||CONOCIMIENTOS_DEFAULT)[esCuarto(curso)?'4':'2'],conocimientos=clave.map((p,i)=>{if(p.tipo==='single'){const v=document.getElementById('fi-con-'+i).value;return v===''?null:parseInt(v)}return(state.registros[id]&&state.registros[id].conocimientos&&state.registros[id].conocimientos[i])||null});db.ref(pathBase()+'/registros/'+id).update({medico,ruffier,actitud,conocimientos});state.editingId=null;showToast('Ficha actualizada')}
function csvVal(v){return'"'+String(v??'').replace(/"/g,'""')+'"'}function exportarCSV(){let csv='Alumno,Curso,NotaConocimientos,NotaRuffier,NotaHabitos,NotaEvaluacionInicial,BateriaEstado,Velocidad50m,Abdominales,SaltoHorizontal,Lanzamiento,Flexibilidad,CourseNavette\n';state.alumnos.forEach(a=>{const r=calcNotaFinal(a.id),b=getBateriaEdu(a),v=b.valores;csv+=[csvVal(a.nombre),csvVal(a.curso),r?.conoc??'',r?.ruf??'',r?.act!==null&&r?.act!==undefined?r.act.toFixed(1):'',r?.final??'',csvVal(b.estado),v.velocidad?.valor??'',v.abdominales?.valor??'',v.salto?.valor??'',v.lanz?.valor??'',v.flex?.valor??'',v.navette?.valor??''].join(',')+'\n'});const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='evaluacion_inicial_con_bateria_edufisica.csv';link.click()}
function profClaves(){let h='<div class="card"><p class="desc">Corrige aquí la respuesta correcta de cualquier pregunta de conocimientos, por curso.</p></div>';['4','2'].forEach(c=>{const clave=(state.claves||CONOCIMIENTOS_DEFAULT)[c];h+='<div class="card"><h2 style="font-size:1rem">'+(c==='4'?'4º ESO':'2º ESO')+'</h2>';clave.forEach((p,i)=>{h+='<div class="editrow"><span style="flex:1">'+(i+1)+'. '+p.q+'</span>';if(p.tipo==='single'){h+='<select onchange="setClaveCorrecta(\''+c+'\','+i+',this.value)">';p.opts.forEach((o,j)=>h+='<option value="'+j+'"'+(p.correcta===j?' selected':'')+'>'+o+'</option>');h+='</select>'}else h+='<span class="small">Multi: '+p.correcta.map(j=>p.opts[j]).join(' + ')+'</span>';h+='</div>'});h+='</div>'});return h}function setClaveCorrecta(c,i,v){const claves=JSON.parse(JSON.stringify(state.claves||CONOCIMIENTOS_DEFAULT));claves[c][i].correcta=parseInt(v);db.ref(pathBase()+'/claves').set(claves);showToast('Clave actualizada')}
iniciarConexiones().then(ok=>{if(ok){loadData();loadEdufisica();setInterval(loadEdufisica,30000);}});
</script>
