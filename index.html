<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tareas de Educación Física</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--ink:#1a1a1a;--soft:#6b6b6b;--line:#dadada;--red:#dc0614;--green:#1f7a4d;--orange:#c98a22}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,sans-serif}.wrap{max-width:1280px;margin:auto;padding:30px 20px 80px}.mast{border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.mast h1{font-family:'Big Shoulders Display',sans-serif;font-size:clamp(34px,6vw,54px);line-height:.9;margin:0;text-transform:uppercase}.sub{font:12px 'JetBrains Mono',monospace;color:var(--soft);letter-spacing:1px;margin-top:8px}.prof{font:700 12px 'JetBrains Mono',monospace;text-transform:uppercase;background:#111;color:#fff;text-decoration:none;padding:10px 14px;border:2px solid #111}.notice{border:2px solid var(--ink);padding:14px 16px;margin-bottom:22px;font-size:13px;line-height:1.55}.courses{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.course{border:3px solid var(--ink);padding:16px;background:#fff}.course h2{font-family:'Big Shoulders Display',sans-serif;font-size:34px;text-transform:uppercase;margin:0 0 14px;padding-bottom:10px;border-bottom:3px solid var(--red)}.eval{margin-bottom:24px}.eval:last-child{margin-bottom:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}.head h3{font:13px 'JetBrains Mono',monospace;letter-spacing:1.2px;text-transform:uppercase;margin:0}.dates{font:10px 'JetBrains Mono',monospace;margin-top:4px;color:var(--soft)}.badge{font:10px 'JetBrains Mono',monospace;border:1px solid;padding:4px 7px;white-space:nowrap}.badge.open{color:var(--green);border-color:var(--green)}.badge.future{color:var(--orange);border-color:var(--orange)}.badge.closed{color:#777;border-color:#999}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#f7f7f7;border:2px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:145px}.card.empty{border-style:dashed;border-color:var(--line)}.num{font:10px 'JetBrains Mono',monospace;color:var(--soft);letter-spacing:1px;text-transform:uppercase}.card h4{font-family:'Big Shoulders Display',sans-serif;font-size:19px;text-transform:uppercase;margin:0;line-height:1.05}.card p{font-size:12px;line-height:1.4;color:var(--soft);margin:0;flex:1}.btn{align-self:flex-start;font:11px 'JetBrains Mono',monospace;padding:8px 11px;border:2px solid var(--red);background:var(--red);color:#fff;text-decoration:none;text-transform:uppercase}.locked,.pending{font:10px 'JetBrains Mono',monospace;color:var(--soft)}@media(max-width:900px){.courses{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="mast"><div><h1>Tareas de<br>Educación Física</h1><div class="sub">CURSO 2026-2027</div></div><a class="prof" href="profesor/">Profesor →</a></div><div class="notice" id="notice"></div><div class="courses"><section class="course"><h2>2.º ESO</h2><div id="course2"></div></section><section class="course"><h2>4.º ESO</h2><div id="course4"></div></section></div></div><script>
const STUDENT_MODE_START=new Date('2026-09-15T00:00:00');const WINDOWS={1:{start:'2026-09-20',end:'2026-12-01',label:'20 sep 2026 – 1 dic 2026'},2:{start:'2026-12-15',end:'2027-03-03',label:'15 dic 2026 – 3 mar 2027'},3:{start:'2027-03-15',end:'2027-06-01',label:'15 mar 2027 – 1 jun 2027'}};
const TASKS=[{curso:'4',evaluacion:1,slot:1,titulo:'Expediente de Verificación: Mitos de la Actividad Física',descripcion:'5 estaciones mito/realidad + situaciones reales para resolver.',url:'4ºESO/eval1-tarea1-mitos/'},{curso:'4',evaluacion:1,slot:2,titulo:'Expediente de Verificación: Presión Competitiva',descripcion:'5 estaciones sobre psicología del rendimiento + situaciones reales para resolver.',url:'4ºESO/eval1-tarea2-presion%20dentro/'},{curso:'4',evaluacion:2,slot:1,titulo:'Expediente de Verificación: Estrategia Deportiva',descripcion:'5 estaciones sobre ataque, defensa y táctica + situaciones reales para resolver.',url:'4ºESO/eval2-tarea1-estrategia/'},{curso:'4',evaluacion:2,slot:2,titulo:'Expediente de Verificación: Arbitraje Deportivo',descripcion:'5 estaciones sobre arbitraje y juego limpio + situaciones reales para resolver.',url:'4ºESO/eval2-tarea2-arbitraje/'},{curso:'4',evaluacion:3,slot:1,titulo:'Reto Motriz',descripcion:'Diseño individual, prueba en grupo y reflexión final sobre un reto que combine al menos dos habilidades motrices.',url:'4ºESO/eval3-tarea1-reto-motriz/'},{curso:'4',evaluacion:3,slot:2,titulo:'Diseña tu Gymkhana Deportiva de Orientación',descripcion:'Proyecto individual de 8 controles con orientación, brújula, pasos y pistas.',url:'4ºESO/eval3-tarea1-gymkhana-orientacion/'},{curso:'2',evaluacion:1,slot:1,titulo:'Nutrición y Vida Activa',descripcion:'Macronutrientes, etiquetas, Dieta Mediterránea, menú semanal, calendario resumen y test final.',url:'2ºESO/eval1-tarea1-nutricion/?v=20260823-2023'},{curso:'2',evaluacion:1,slot:2,titulo:'CASO DOMS',descripcion:'Agujetas: ciencia, mitos, línea del tiempo, mapa conceptual, casos de recuperación y test final.',url:'2ºESO/eval1-tarea2-doms/?v=20260823'},{curso:'2',evaluacion:2,slot:1,titulo:'MISIÓN 112',descripcion:'Primeros auxilios: lectura, PAS y 112, RICE, decisiones, SVB, roleplay práctico y test final.',url:'2ºESO/eval2-tarea1-mision-112/?v=20260823'},{curso:'2',evaluacion:2,slot:2,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:3,slot:1,titulo:'',descripcion:'',url:''},{curso:'2',evaluacion:3,slot:2,titulo:'',descripcion:'',url:''}];
function prep(){return new Date()<STUDENT_MODE_START}function state(ev){if(prep())return{cls:'open',txt:'● Preparación · abierto',canOpen:true};const w=WINDOWS[ev],n=new Date(),s=new Date(w.start+'T00:00:00'),e=new Date(w.end+'T23:59:59');if(n<s)return{cls:'future',txt:'Aún no abierta',canOpen:false};if(n>e)return{cls:'closed',txt:'Plazo cerrado',canOpen:false};return{cls:'open',txt:'● Plazo abierto',canOpen:true}}
function renderCourse(course,target){const c=document.getElementById(target);c.innerHTML='';[1,2,3].forEach(ev=>{const st=state(ev),w=WINDOWS[ev],block=document.createElement('div');block.className='eval';const ts=TASKS.filter(t=>t.curso===course&&t.evaluacion===ev).sort((a,b)=>a.slot-b.slot);const cards=ts.map(t=>{if(!t.titulo)return`<div class="card empty"><span class="num">Tarea ${t.slot}</span><p>Contenido de 2.º ESO pendiente de diseñar.</p></div>`;let action=!t.url?'<span class="pending">Pendiente de publicar</span>':st.canOpen?`<a class="btn" href="${t.url}">Abrir tarea →</a>`:`<span class="locked">${st.txt}</span>`;return`<div class="card"><span class="num">Tarea ${t.slot}</span><h4>${t.titulo}</h4><p>${t.descripcion}</p>${action}</div>`}).join('');block.innerHTML=`<div class="head"><div><h3>${ev}ª Evaluación</h3><div class="dates">${w.label}</div></div><span class="badge ${st.cls}">${st.txt}</span></div><div class="cards">${cards}</div>`;c.appendChild(block)})}
document.getElementById('notice').innerHTML=prep()?'<b>Modo preparación:</b> hasta el 14 de septiembre las tareas publicadas permanecen abiertas. Desde el <b>15 de septiembre</b> se aplican los plazos del alumnado. 2.º ESO y 4.º ESO quedan siempre separados.':'<b>Modo alumnado:</b> cada tarea se abre y cierra según sus fechas. 2.º ESO queda a la izquierda y 4.º ESO a la derecha.';renderCourse('2','course2');renderCourse('4','course4');
</script></body></html>
