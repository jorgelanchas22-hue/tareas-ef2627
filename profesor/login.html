<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso profesor · Educación Física</title><style>:root{--r:#dc0614;--ink:#171717;--soft:#666;--green:#137a4a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:var(--ink)}.top{border-bottom:4px solid var(--r);padding:14px 18px;font-weight:800}.wrap{max-width:520px;margin:70px auto;padding:0 18px}.box{border:3px solid #111;padding:24px;background:#fafafa}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--soft);font-size:13px;line-height:1.5}.btn{width:100%;border:2px solid var(--r);background:var(--r);color:#fff;padding:12px 14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px}.back{display:block;text-align:center;margin-top:14px;color:#111}.msg{margin-top:15px;padding:11px;background:#fff;border-left:5px solid #999;font-size:13px;line-height:1.45;min-height:44px}.msg.ok{border-color:var(--green);background:#eefaf3}.msg.bad{border-color:#a11;background:#fff2f2}.code{font-family:monospace;font-size:12px;word-break:break-all;margin-top:6px}</style></head><body><div class="top">Salesianos San Pedro · Educación Física · PROFESOR</div><div class="wrap"><div class="box"><h1>Acceso profesor</h1><p class="sub">Acceso exclusivo con la cuenta institucional autorizada. Este sistema usa redirección de Google para evitar los problemas de ventanas emergentes.</p><button id="enter" class="btn">🔐 Entrar con Google</button><div id="msg" class="msg">Cuenta autorizada: <b>jorge.lanchas@triana.salesianos.edu</b></div><a class="back" href="../">← Volver a tareas</a></div></div><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script>const firebaseConfig={apiKey:'AIzaSyCsPi1YtKxDyeVKTvx2y2z_b48qluqpJAU',authDomain:'tareas-alumnado2y4eso.firebaseapp.com',databaseURL:'https://tareas-alumnado2y4eso-default-rtdb.europe-west1.firebasedatabase.app',projectId:'tareas-alumnado2y4eso'};firebase.initializeApp(firebaseConfig);const AUTHORIZED='jorge.lanchas@triana.salesianos.edu',msg=document.getElementById('msg'),enter=document.getElementById('enter');function show(text,kind,code){msg.className='msg '+(kind||'');msg.innerHTML=text+(code?`<div class="code">${code}</div>`:'')}async function validate(user){const email=((user&&user.email)||'').toLowerCase();if(!email)return false;if(email!==AUTHORIZED.toLowerCase()){await firebase.auth().signOut();show('Esta cuenta no está autorizada. Selecciona la cuenta institucional del profesor.','bad',email);return false}show('✓ Acceso correcto. Abriendo el panel del profesor…','ok');setTimeout(()=>location.replace('./?v=20260907'),250);return true}async function init(){try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);const result=await firebase.auth().getRedirectResult();if(result&&result.user){await validate(result.user);return}firebase.auth().onAuthStateChanged(u=>{if(u)validate(u)})}catch(e){show('No se pudo completar el acceso con Google.','bad',(e&&e.code?e.code+': ':'')+(e&&e.message?e.message:String(e)))}}enter.onclick=async()=>{enter.disabled=true;show('Abriendo Google…');const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await firebase.auth().signInWithRedirect(p)}catch(e){enter.disabled=false;show('No se pudo iniciar el acceso.','bad',(e&&e.code?e.code+': ':'')+(e&&e.message?e.message:String(e)))}};init();</script></body></html>
