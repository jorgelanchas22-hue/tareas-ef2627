<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso profesor · Educación Física</title><style>:root{--r:#dc0614;--ink:#171717;--soft:#666;--green:#137a4a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:var(--ink)}.top{border-bottom:4px solid var(--r);padding:14px 18px;font-weight:800}.wrap{max-width:560px;margin:60px auto;padding:0 18px}.box{border:3px solid #111;padding:24px;background:#fafafa}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--soft);font-size:13px;line-height:1.5}.btn{width:100%;border:2px solid var(--r);background:var(--r);color:#fff;padding:12px 14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}.btn.alt{background:#fff;color:#111;border-color:#111}.back{display:block;text-align:center;margin-top:14px;color:#111}.msg{margin-top:15px;padding:11px;background:#fff;border-left:5px solid #999;font-size:13px;line-height:1.45;min-height:44px}.msg.ok{border-color:var(--green);background:#eefaf3}.msg.bad{border-color:#a11;background:#fff2f2}.code{font-family:monospace;font-size:11px;word-break:break-word;margin-top:7px}</style></head><body><div class="top">Salesianos San Pedro · Educación Física · PROFESOR</div><div class="wrap"><div class="box"><h1>Acceso profesor</h1><p class="sub">Acceso exclusivo con <b>jorge.lanchas@triana.salesianos.edu</b>. Hemos forzado una credencial nueva de Google para evitar el error de sesión caducada.</p><button id="enter" class="btn">🔐 Entrar con Google</button><button id="redirect" class="btn alt">Usar redirección de Google</button><div id="msg" class="msg">Pulsa «Entrar con Google» y selecciona la cuenta institucional.</div><a class="back" href="../">← Volver a tareas</a></div></div><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script>const firebaseConfig={apiKey:'AIzaSyCsPi1YtKxDyeVKTvx2y2z_b48qluqpJAU',authDomain:'tareas-alumnado2y4eso.firebaseapp.com',databaseURL:'https://tareas-alumnado2y4eso-default-rtdb.europe-west1.firebasedatabase.app',projectId:'tareas-alumnado2y4eso'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),AUTHORIZED='jorge.lanchas@triana.salesianos.edu',msg=document.getElementById('msg'),enter=document.getElementById('enter'),redirect=document.getElementById('redirect');auth.useDeviceLanguage();function show(text,kind,code){msg.className='msg '+(kind||'');msg.innerHTML=text+(code?`<div class="code">${code}</div>`:'')}function freshProvider(){const p=new firebase.auth.GoogleAuthProvider();p.addScope('email');p.addScope('profile');p.setCustomParameters({prompt:'consent select_account',hd:'triana.salesianos.edu'});return p}async function validate(user){const email=((user&&user.email)||'').toLowerCase();if(email!==AUTHORIZED.toLowerCase()){await auth.signOut();show('Esta cuenta no está autorizada. Selecciona la cuenta institucional del profesor.','bad',email||'sin correo');return false}show('✓ Acceso correcto. Abriendo el panel…','ok');setTimeout(()=>location.replace('panel.html?v=20260907b'),250);return true}async function prepareFresh(){try{if(auth.currentUser)await auth.signOut()}catch(e){}await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}async function popupLogin(){enter.disabled=true;redirect.disabled=true;show('Solicitando una credencial nueva a Google…');try{await prepareFresh();const res=await auth.signInWithPopup(freshProvider());await validate(res.user)}catch(e){try{await auth.signOut()}catch(_){}const code=(e&&e.code)||'auth/error';if(code==='auth/invalid-credential')show('Google ha rechazado la credencial anterior. Ya la hemos limpiado. Pulsa de nuevo «Entrar con Google» y vuelve a elegir la cuenta institucional.','bad',code);else show('No se pudo iniciar sesión con Google.','bad',code+(e&&e.message?' · '+e.message:''))}finally{enter.disabled=false;redirect.disabled=false}}async function redirectLogin(){enter.disabled=true;redirect.disabled=true;show('Preparando una sesión nueva y redirigiendo a Google…');try{await prepareFresh();sessionStorage.setItem('ef_teacher_redirect','1');await auth.signInWithRedirect(freshProvider())}catch(e){enter.disabled=false;redirect.disabled=false;show('No se pudo iniciar la redirección.','bad',(e&&e.code?e.code:'auth/error')+(e&&e.message?' · '+e.message:''))}}enter.onclick=popupLogin;redirect.onclick=redirectLogin;auth.getRedirectResult().then(async r=>{if(r&&r.user){sessionStorage.removeItem('ef_teacher_redirect');await validate(r.user)}}).catch(async e=>{try{await auth.signOut()}catch(_){}show('Google devolvió una credencial no válida. La sesión se ha limpiado; pulsa «Entrar con Google».','bad',(e&&e.code)||'auth/error')});</script></body></html>
