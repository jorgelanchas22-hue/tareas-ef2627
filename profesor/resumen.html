<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resumen de criterios · EF</title><style>:root{--r:#dc0614;--ink:#171717;--line:#ddd;--blue:#2563eb;--green:#137a4a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink)}.top{border-bottom:4px solid var(--r);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}.top a{color:#111}.wrap{max-width:1400px;margin:auto;padding:24px 18px 70px}.hidden{display:none!important}.gate{max-width:380px;margin:70px auto;border:2px solid #111;padding:22px}.gate input,select{width:100%;padding:10px;border:2px solid #111;font:14px Arial}.btn{border:2px solid var(--r);background:var(--r);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:#111;border-color:#111}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}.toolbar>div{min-width:180px}.toolbar label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:4px}.notice{border:2px solid #111;background:#f7f7f7;padding:14px;margin:12px 0;line-height:1.5}.studentCard{border:3px solid #111;padding:18px;margin:18px 0}.studentCard h2{margin-top:0}.critList{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.crit{border-left:5px solid var(--blue);background:#f4f8ff;padding:12px}.grade{font-size:28px;font-weight:900;margin-top:8px}.pending{color:#666;font-size:12px}.tableWrap{overflow:auto;border:2px solid #111;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{border:1px solid var(--line);padding:8px;text-align:center;font-size:12px}th{background:#111;color:#fff}.name{text-align:left;font-weight:700;position:sticky;left:0;background:#fff}@media(max-width:700px){.critList{grid-template-columns:1fr}}</style></head><body><div class="top"><span>Salesianos San Pedro · EF · PROFESOR</span><div><a href="./">Evaluación</a> · <a href="../">Panel de tareas</a></div></div><div class="wrap"><div id="gate" class="gate"><h2>Acceso profesor</h2><p><button id="enter" class="btn">🔐 Entrar con Google</button></p><p id="gateMsg"></p></div><div id="app" class="hidden"><h1>Resumen de criterios</h1><div class="notice"><b>Nota del criterio /10.</b> Se calcula automáticamente con la <b>media de las notas finales validadas</b> de las tareas que trabajan ese criterio. Las propuestas no validadas no cuentan.</div><div class="toolbar"><div><label>Curso</label><select id="course"><option value="2ESO">2.º ESO</option><option value="4ESO">4.º ESO</option></select></div><div><label>Grupo</label><select id="group"></select></div><div><label>Alumno</label><select id="student"></select></div><button id="refresh" class="btn alt">Actualizar</button><button id="csv" class="btn alt">Exportar resumen CSV</button></div><div id="studentView"></div><h2>Grupo completo</h2><div id="groupInfo" class="pending"></div><div class="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script>const D=id=>document.getElementById(id);const firebaseConfig={apiKey:'AIzaSyCsPi1YtKxDyeVKTvx2y2z_b48qluqpJAU',authDomain:'tareas-alumnado2y4eso.firebaseapp.com',databaseURL:'https://tareas-alumnado2y4eso-default-rtdb.europe-west1.firebasedatabase.app',projectId:'tareas-alumnado2y4eso'};firebase.initializeApp(firebaseConfig);const db=firebase.database(),AUTHORIZED_EMAIL='jorge.lanchas@triana.salesianos.edu';let authReady=Promise.resolve();D('enter').onclick=async()=>{D('gateMsg').textContent='Abriendo Google...';const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});try{const res=await firebase.auth().signInWithPopup(provider);const email=((res.user&&res.user.email)||'').toLowerCase();if(email!==AUTHORIZED_EMAIL.toLowerCase()){D('gateMsg').textContent='Esta cuenta no está autorizada.';firebase.auth().signOut();return}D('gateMsg').textContent='';start()}catch(e){D('gateMsg').textContent=(e&&e.code==='auth/popup-closed-by-user')?'Se cerró la ventana de Google.':'No se pudo iniciar sesión con Google.'}};firebase.auth().onAuthStateChanged(u=>{if(u&&u.email&&u.email.toLowerCase()===AUTHORIZED_EMAIL.toLowerCase())start()});const T2=[{id:'e1t1',cr:['2.1.2','2.1.5']},{id:'e1t2',cr:['2.1.2','2.1.3']},{id:'e2t1',cr:['2.1.3','2.1.4']},{id:'e2t2',cr:['2.3.1','2.3.3']},{id:'e3t1',cr:['2.2.1','2.3.2']},{id:'e3t2',cr:['2.1.2','2.2.3']}],T4=[{id:'e1t1',cr:['4.1.5','4.1.6']},{id:'e1t2',cr:['4.1.2','4.3.1']},{id:'e2t1',cr:['4.2.2','4.2.3']},{id:'e2t2',cr:['4.3.1','4.3.3']},{id:'e3t1',cr:['4.2.1','4.2.3']},{id:'e3t2',cr:['4.5.2','4.2.1']}];let roster=[],grades={};const slug=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),gk=(g,n)=>slug(g)+'__'+slug(n);function groups(c){return c==='2ESO'?['2A','2B','2C']:['4A','4B','4C']}async function get(p){try{return(await db.ref(p).once('value')).val()||{}}catch(e){return{}}}async function start(){D('gate').classList.add('hidden');D('app').classList.remove('hidden');await authReady.catch(()=>{});setGroups();await load()}function setGroups(){D('group').innerHTML=groups(D('course').value).map(g=>`<option>${g}</option>`).join('')}D('course').onchange=()=>{setGroups();load()};D('group').onchange=load;D('student').onchange=renderStudent;D('refresh').onclick=load;async function load(){const c=D('course').value,g=D('group').value;let r=await get('listas_grupos/'+g);roster=Array.isArray(r)?r:Object.values(r||{}).filter(x=>typeof x==='string');grades=await get(`calificaciones_criterios_ef/2026-2027/${c}/${g}`);D('student').innerHTML=roster.map(n=>`<option>${n}</option>`).join('');renderAll()}function totals(n){const tasks=D('course').value==='2ESO'?T2:T4,out={};for(const t of tasks){const sv=grades?.[gk(D('group').value,n)]?.[t.id]||{},v=sv.notaFinal;if(v===null||v===undefined||v==='')continue;const num=Number(v);if(!Number.isFinite(num))continue;t.cr.forEach(c=>{out[c]=out[c]||{sum:0,count:0};out[c].sum+=num;out[c].count++})}return out}function fmt(v){return Number(v).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1')}function renderStudent(){const n=D('student').value;if(!n){D('studentView').innerHTML='<div class="notice">No hay alumnos cargados en este grupo.</div>';return}const x=totals(n),tasks=D('course').value==='2ESO'?T2:T4,codes=[...new Set(tasks.flatMap(t=>t.cr))].sort();D('studentView').innerHTML=`<div class="studentCard"><h2>${n}</h2><div class="critList">${codes.map(c=>{const v=x[c];return`<div class="crit"><b>EFI.${c}</b><div class="grade">${v?fmt(v.sum/v.count):'—'} / 10</div><div class="pending">${v?`Media de ${v.count} tarea${v.count>1?'s':''} validada${v.count>1?'s':''}`:'Sin tareas validadas todavía'}</div></div>`}).join('')}</div></div>`}function renderGroup(){const tasks=D('course').value==='2ESO'?T2:T4,codes=[...new Set(tasks.flatMap(t=>t.cr))].sort(),all=roster.map(n=>({n,x:totals(n)}));D('thead').innerHTML='<tr><th>Alumno</th>'+codes.map(c=>`<th>EFI.${c}<br>/10</th>`).join('')+'</tr>';D('tbody').innerHTML=all.map(a=>`<tr><td class="name">${a.n}</td>${codes.map(c=>{const v=a.x[c];return`<td>${v?fmt(v.sum/v.count):'—'}</td>`}).join('')}</tr>`).join('');D('groupInfo').textContent=`${roster.length} alumnos · ${codes.length} criterios` }function renderAll(){renderStudent();renderGroup()}D('csv').onclick=()=>{const tasks=D('course').value==='2ESO'?T2:T4,codes=[...new Set(tasks.flatMap(t=>t.cr))].sort(),rows=[['Alumno',...codes.map(x=>'EFI.'+x)]];for(const n of roster){const x=totals(n);rows.push([n,...codes.map(c=>x[c]?fmt(x[c].sum/x[c].count):'')])}const txt=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv'}));a.download=`resumen-criterios-${D('course').value}-${D('group').value}.csv`;a.click()};</script></body></html>
