<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis correcciones · EF</title><style>:root{--r:#dc0614;--ink:#171717;--line:#ddd;--blue:#2563eb;--green:#137a4a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#fafafa}.top{background:#fff;border-bottom:4px solid var(--r);padding:14px 18px;font-weight:800;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a{background:#111;color:#fff;text-decoration:none;padding:9px 13px;border:2px solid #111}.wrap{max-width:900px;margin:auto;padding:24px 16px 70px}.card{background:#fff;border:2px solid #111;padding:16px;margin:14px 0}.controls{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px;align-items:end}.controls label{font-size:11px;font-weight:800;text-transform:uppercase}.controls select{width:100%;padding:10px;border:2px solid #111;margin-top:4px}.btn{border:2px solid var(--r);background:var(--r);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.task{background:#fff;border:2px solid #111;padding:16px;margin:14px 0}.task h2{margin:0 0 8px}.grade{font-size:34px;font-weight:900;color:var(--green)}.label{font-size:11px;font-weight:800;text-transform:uppercase;color:#666;margin-top:12px}.text{line-height:1.5;margin-top:4px}.criteria{border-left:4px solid var(--blue);background:#f4f8ff;padding:8px;margin-top:12px}.empty{background:#fff;border:2px solid #111;padding:18px}@media(max-width:700px){.controls{grid-template-columns:1fr}}</style></head><body><div class="top"><span>Salesianos San Pedro · Educación Física · Mis correcciones</span><a href="../">← Volver al panel de tareas</a></div><div class="wrap"><div class="card"><h1>Consulta tus correcciones</h1><p>Elige tu curso, grupo y nombre. Solo aparecen las tareas cuya corrección ha sido validada por el profesor.</p><div class="controls"><label>Curso<select id="course"><option value="2ESO">2.º ESO</option><option value="4ESO">4.º ESO</option></select></label><label>Grupo<select id="group"></select></label><label>Alumno<select id="student"></select></label><button id="load" class="btn">Ver correcciones</button></div></div><div id="result"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script>const D=id=>document.getElementById(id);const firebaseConfig={apiKey:'AIzaSyCsPi1YtKxDyeVKTvx2y2z_b48qluqpJAU',authDomain:'tareas-alumnado2y4eso.firebaseapp.com',databaseURL:'https://tareas-alumnado2y4eso-default-rtdb.europe-west1.firebasedatabase.app',projectId:'tareas-alumnado2y4eso'};firebase.initializeApp(firebaseConfig);const db=firebase.database();firebase.auth().signInAnonymously().catch(()=>{});const slug=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),gk=(g,n)=>slug(g)+'__'+slug(n),esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]));const LABELS={e1t1:'Tarea 1 · 1ª evaluación',e1t2:'Tarea 2 · 1ª evaluación',e2t1:'Tarea 1 · 2ª evaluación',e2t2:'Tarea 2 · 2ª evaluación',e3t1:'Tarea 1 · 3ª evaluación',e3t2:'Tarea 2 · 3ª evaluación'};function groups(c){return c==='2ESO'?['2A','2B','2C']:['4A','4B','4C']}async function get(p){try{return(await db.ref(p).once('value')).val()||{}}catch(e){return{}}}function setGroups(){D('group').innerHTML=groups(D('course').value).map(g=>`<option>${g}</option>`).join('')}async function loadStudents(){let r=await get('listas_grupos/'+D('group').value),a=Array.isArray(r)?r:Object.values(r||{}).filter(x=>typeof x==='string');D('student').innerHTML=a.map(n=>`<option>${esc(n)}</option>`).join('')}D('course').onchange=async()=>{setGroups();await loadStudents()};D('group').onchange=loadStudents;D('load').onclick=show;async function show(){const c=D('course').value,g=D('group').value,n=D('student').value;if(!n){D('result').innerHTML='<div class="empty">No hay alumno seleccionado.</div>';return}const data=await get(`calificaciones_criterios_ef/2026-2027/${c}/${g}/${gk(g,n)}`),rows=Object.entries(data||{}).filter(([,x])=>x&&x.visibleAlumno===true&&x.notaFinal!==null&&x.notaFinal!==undefined);if(!rows.length){D('result').innerHTML='<div class="empty"><b>Todavía no tienes correcciones publicadas.</b></div>';return}D('result').innerHTML=rows.map(([id,x])=>`<div class="task"><h2>${esc(x.tarea||LABELS[id]||id)}</h2><div class="grade">${String(x.notaFinal).replace('.',',')} / 10</div><div class="label">Por qué esta nota</div><div class="text">${esc(x.motivoPropuesta||'Sin comentario publicado.')}</div><div class="label">Qué puedes mejorar</div><div class="text">${esc(x.mejora||'Sin indicaciones adicionales.')}</div>${Array.isArray(x.criterios)?`<div class="criteria"><b>Criterios trabajados</b><br>${x.criterios.map(esc).join(' · ')}</div>`:''}</div>`).join('')}setGroups();loadStudents();</script></body></html>
